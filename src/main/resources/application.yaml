spring:
  application:
    name: hiking-manage-back
  datasource:
    driver-class-name: org.sqlite.JDBC
    # 通过环境变量指定数据库连接地址，可指向容器间共享的数据文件
    url: ${SPRING_DATASOURCE_URL}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml
server:
  port: 8080
jwt:
  # 通过环境变量提供 JWT 签名密钥
  secret: ${JWT_SECRET}
  # 通过环境变量指定 JWT 有效期，单位为分钟
  expire-minutes: ${JWT_EXPIRE_MINUTES}
auth:
  # 通过环境变量提供新用户的默认密码
  default-password: ${AUTH_DEFAULT_PASSWORD}
  default-password-tip: "当前密码为默认密码，请尽快修改密码"
